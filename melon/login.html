<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="login.css">
    <title>멜론아이디 로그인</title>
</head>
<body>
    <div id="wrap">
        <header>
            <button type="button" class="prev_btn">
                <span class="sr-only">이전</span>
            </button>
            <h1>멜론아이디 로그인</h1>
        </header>

        <main>
            <form action="">
                <fieldset>
                    <legend class="sr-only">멜론아이디 로그인</legend>

                    <div class="login_form">
                        <div class="email_login">
                            <label for="email">이메일 로그인</label>
                            <input type="email" id="email" name="email" placeholder="아이디">
                        </div>

                        <div class="password_login">
                            <label class="sr-only" for="password">비밀번호</label>
                            <input type="password" id="password" name="password" placeholder="비밀번호">
                        </div>

                        <div class="login_option">
                            <label>
                                <input type="checkbox" class="check sr-only" checked>
                                <span>자동로그인</span>
                            </label>
                            <label>
                                <input type="checkbox" class="check sr-only">
                                <span>아이디 저장</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="login_btn">로그인</button>

                    <nav class="login_link" aria-label="로그인 관련 메뉴">
                        <a href="#">아이디 찾기</a>
                        <a href="#">비밀번호 재설정</a>
                        <a href="#">회원가입</a>
                    </nav>
                </fieldset>
            </form>

            <section class="sns_login" aria-labelledby="sns-title">
                <div class="sns_title">
                    <span></span>
                    <h2 id="sns-title">SNS로 간편하게 로그인</h2>
                    <span></span>
                </div>

                <div class="sns_list">
                    <a href="#">
                        <span class="sr-only">카카오로 로그인</span>
                    </a>
                    <a href="#">
                        <span class="sr-only">네이버로 로그인</span>
                    </a>
                    <a href="#">
                        <span class="sr-only">애플로 로그인</span>
                    </a>
                    <a href="#">
                        <span class="sr-only">삼성카드로 로그인</span>
                    </a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
