<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>샘표리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper-wrapper">
                        <video class="pc" autoplay muted loop playsinline>
                            <source src="video/sempio_video01.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="swiper-slide">
                        <video class="pc" autoplay muted loop playsinline>
                            <source src="video/sempio_video02.mp4" type="video/mp4">
                        </video>
                    </div>
                    ...
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- If we need scrollbar -->
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiperHero = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,
    
            pagination: {
                el: '.swiper-pagination',
            },
    
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
    
            scrollbar: {
                el: '.swiper-scrollbar',
            },
        });
    
        // 현재 활성화된 슬라이드의 영상만 재생
        function playActiveVideo() {
            const slides = swiperHero.slides;
    
            // 이전 영상은 멈추고 처음으로 되돌리기
            slides.forEach((slide) => {
                const video = slide.querySelector('video');
    
                if (video) {
                    video.pause();
                    video.currentTime = 0;
                    video.onended = null;
                }
            });
    
            // 현재 슬라이드의 영상 찾기
            const activeSlide = swiperHero.slides[
                swiperHero.activeIndex
            ];
    
            const activeVideo = activeSlide.querySelector('video');
    
            if (!activeVideo) return;
    
            // 영상이 끝나면 다음 슬라이드로 이동
            activeVideo.onended = () => {
                swiperHero.slideNext();
            };
    
            activeVideo.play().catch((error) => {
                console.error('영상 재생 실패:', error);
            });
        }
    
        // 최초 영상 재생
        playActiveVideo();
    
        // 슬라이드 전환이 끝나면 다음 영상 재생
        swiperHero.on('slideChangeTransitionEnd', playActiveVideo);
    </script>
</body>
</html>
