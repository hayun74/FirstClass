<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>샘표리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <!-- 첫 번째 영상 -->
                        <div class="swiper-slide">
                            <video muted playsinline preload="metadata">
                                <source src="video/sempio_video01.mp4" type="video/mp4">
                            </video>
                        </div>

                        <!-- 두 번째 영상 -->
                        <div class="swiper-slide">
                            <video muted playsinline preload="metadata">
                                <source src="video/sempio_video02.mp4" type="video/mp4">
                            </video>
                        </div>
                    </div>

                    <!-- 화살표 -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- 영상 진행률을 표시하는 두 개의 막대 -->
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const progressBar = document.querySelector('.swiper-scrollbar');

        const swiperHero = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,

            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },

            scrollbar: {
                el: '.swiper-scrollbar',
            },
        });

        // 두 막대의 진행률을 CSS 변수로 전달
        function updateProgressBar(video, slideIndex) {
            if (!video || !Number.isFinite(video.duration) || video.duration <= 0) return;

            const progress = Math.min((video.currentTime / video.duration) * 100, 100);

            if (slideIndex === 0) {
                progressBar.style.setProperty('--first-progress', progress + '%');
                progressBar.style.setProperty('--second-progress', '0%');
            } else {
                // 두 번째 영상이 시작되면 첫 번째 막대는 흰색으로 유지
                progressBar.style.setProperty('--first-progress', '100%');
                progressBar.style.setProperty('--second-progress', progress + '%');
            }
        }

        // 현재 활성화된 슬라이드의 영상만 재생
        function playActiveVideo() {
            const slides = swiperHero.slides;

            // 이전 영상은 멈추고 처음으로 되돌리기
            slides.forEach((slide) => {
                const video = slide.querySelector('video');

                if (video) {
                    video.pause();
                    video.currentTime = 0;
                    video.onended = null;
                    video.ontimeupdate = null;
                }
            });

            const activeSlide = swiperHero.slides[swiperHero.activeIndex];
            if (!activeSlide) return;

            const activeVideo = activeSlide.querySelector('video');
            if (!activeVideo) return;

            const slideIndex = Number(activeSlide.getAttribute('data-swiper-slide-index') || 0);

            // 첫 번째 영상으로 돌아오면 첫 막대부터 다시 진행
            if (slideIndex === 0) {
                progressBar.style.setProperty('--first-progress', '0%');
                progressBar.style.setProperty('--second-progress', '0%');
            } else {
                progressBar.style.setProperty('--first-progress', '100%');
                progressBar.style.setProperty('--second-progress', '0%');
            }

            // 영상 재생 시간에 맞춰 진행 막대를 업데이트
            activeVideo.ontimeupdate = () => {
                updateProgressBar(activeVideo, slideIndex);
            };

            // 영상이 끝나면 다음 슬라이드로 이동
            activeVideo.onended = () => {
                if (slideIndex === 0) {
                    progressBar.style.setProperty('--first-progress', '100%');
                } else {
                    progressBar.style.setProperty('--second-progress', '100%');
                }
                swiperHero.slideNext();
            };

            activeVideo.play().catch((error) => {
                console.error('영상 재생 실패:', error);
            });
        }

        // 최초 영상 재생
        playActiveVideo();

        // 슬라이드 전환이 끝나면 다음 영상 재생
        swiperHero.on('slideChangeTransitionEnd', playActiveVideo);
    </script>
</body>
</html>
